[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "gradia-lens"
version = "0.1.0a2"
description = "Reversible experiments on real model computation, with measured boundaries and replayable receipts."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Gradia"}]
keywords = ["interpretability", "activation-steering", "model-research", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
model = [
  "torch==2.8.0",
  "transformers==4.57.3",
  "numpy==1.26.4",
  "huggingface-hub==0.36.0",
  "tokenizers==0.22.1",
  "safetensors==0.7.0",
]
dev = ["pytest>=8.2,<10", "build>=1.2,<2"]

[project.urls]
Homepage = "https://www.gradiahq.com/lens"
Repository = "https://github.com/rudycelekli/gradia-lens"
Issues = "https://github.com/rudycelekli/gradia-lens/issues"

[project.scripts]
gradia-lens = "gradia_lens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["gradia_lens", "gradia_lens.*"]
namespaces = false

[tool.setuptools.package-data]
gradia_lens = ["py.typed"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
